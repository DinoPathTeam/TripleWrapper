name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Rust core checks
  rust-core:
    name: Rust Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/core
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --all-targets

      - name: Run tests
        run: cargo test --all-targets

  # Python GUI checks (canonical GUI at repo root; gi-free unit tests)
  python-gui:
    name: Python GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lint and test tools
        run: |
          pip install --upgrade pip
          pip install "ruff>=0.3" "mypy>=1.0" "pytest>=7.0"

      - name: Run ruff
        run: ruff check triplewrapper_gui tests

      - name: Run mypy
        run: mypy triplewrapper_gui

      - name: Run tests
        run: pytest tests/unit -v

  # Integration test
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [rust-core, python-gui]
    steps:
      - uses: actions/checkout@v5

      - name: Build core
        run: |
          cd src/core
          cargo build --release

      - name: Test CLI protocol
        run: |
          cd src/core
          ./target/release/triplewrapper-core --help
          ./target/release/triplewrapper-core disks
          dd if=/dev/zero of=/tmp/ci-test.zip bs=1M count=5
          ./target/release/triplewrapper-core analyze -a /tmp/ci-test.zip --json | python3 -c "import json,sys; d=json.loads(sys.stdin.read()); assert d['kind']=='analysis', d; print('analyze protocol OK:', d['data']['status'])"
          ./target/release/triplewrapper-core queue add -a /tmp/ci-test.zip -o test --priority normal
          ./target/release/triplewrapper-core queue list --status pending | head -5

      - name: Test GUI syntax and protocol
        run: |
          python3 -m py_compile triplewrapper_gui/main.py triplewrapper_gui/application.py triplewrapper_gui/main_window.py triplewrapper_gui/views/welcome_view.py triplewrapper_gui/views/analysis_view.py triplewrapper_gui/views/progress_view.py triplewrapper_gui/widgets/steam_graph.py triplewrapper_gui/widgets/storage_donut.py triplewrapper_gui/widgets/queue_panel.py triplewrapper_gui/core/bridge.py triplewrapper_gui/core/models.py triplewrapper_gui/core/protocol.py
          python3 -c "import sys; sys.path.insert(0,'.'); from triplewrapper_gui.core.protocol import parse_event_line; assert parse_event_line('{\"kind\":\"tick\",\"data\":{}}')[0]=='tick'; print('GUI protocol OK')"

  # Flatpak build
  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-latest
    needs: [rust-core, python-gui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flatpak Builder
        uses: flatpak/flatpak-github-actions/setup-flatpak@v2

      - name: Install GNOME SDK
        run: |
          flatpak install --user -y flathub org.gnome.Platform//46 org.gnome.Sdk//46

      - name: Build Flatpak
        run: |
          flatpak-builder --force-clean --user --install-deps-from=flathub \
            build-dir flatpak/com.triplewrapper.TripleWrapper.json

      - name: Test Flatpak
        run: |
          flatpak run --command=triplewrapper-gui com.triplewrapper.TripleWrapper --help

  # Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [integration, flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src/core/target/release/triplewrapper-core
            flatpak/build-dir/com.triplewrapper.TripleWrapper.flatpak
