name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Rust core checks
  rust-core:
    name: Rust Core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/core
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --release --all-targets

      - name: Run tests
        run: cargo test --all-targets

  # Python GUI checks (canonical GUI at repo root; gi-free unit tests)
  python-gui:
    name: Python GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lint and test tools
        run: |
          pip install --upgrade pip
          pip install "ruff>=0.3" "mypy>=1.0" "pytest>=7.0"

      - name: Run ruff
        run: ruff check triplewrapper_gui tests

      - name: Run mypy
        run: mypy triplewrapper_gui

      - name: Run tests
        run: pytest tests/unit -v

      - name: Guard meson install list matches tree
        run: |
          python3 -c "
          import re, pathlib
          listed = set(re.findall(r\"'(triplewrapper_gui/[^']+\.py)'\", open('meson.build').read()))
          actual = {str(p) for p in pathlib.Path('triplewrapper_gui').rglob('*.py') if '__pycache__' not in str(p)}
          missing, extra = sorted(actual - listed), sorted(listed - actual)
          assert not missing and not extra, f'meson install list out of sync: missing={missing} extra={extra}'
          print(f'meson install list OK ({len(actual)} files)')
          "

  # Integration test
  integration:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [rust-core, python-gui]
    steps:
      - uses: actions/checkout@v5

      - name: Build core
        run: |
          cd src/core
          cargo build --release

      - name: Test CLI protocol
        run: |
          cd src/core
          ./target/release/triplewrapper-core --help
          ./target/release/triplewrapper-core disks
          dd if=/dev/zero of=/tmp/ci-test.zip bs=1M count=5
          ./target/release/triplewrapper-core analyze -a /tmp/ci-test.zip --json | python3 -c "import json,sys; d=json.loads(sys.stdin.read()); assert d['kind']=='analysis', d; print('analyze protocol OK:', d['data']['status'])"
          ./target/release/triplewrapper-core queue add -a /tmp/ci-test.zip -o test --priority normal
          ./target/release/triplewrapper-core queue list --status pending | head -5

      - name: Test GUI syntax and protocol
        run: |
          python3 -m compileall -q triplewrapper_gui
          python3 -c "import sys; sys.path.insert(0,'.'); from triplewrapper_gui.core.protocol import parse_event_line; assert parse_event_line('{\"kind\":\"tick\",\"data\":{}}')[0]=='tick'; print('GUI protocol OK')"

  # Flatpak build (blocking: SDK 50 + offline Rust build verified green).
  # Runs on tags too: the Release job needs its bundle artifact, and a
  # skipped need would skip the release itself.
  flatpak:
    name: Flatpak Build
    runs-on: ubuntu-latest
    needs: [rust-core, python-gui]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v5

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME SDK
        run: |
          flatpak install --user -y flathub org.gnome.Platform//50 org.gnome.Sdk//50

      - name: Build and install Flatpak
        run: |
          flatpak-builder --force-clean --user --install --install-deps-from=flathub \
            build-dir flatpak/io.github.dinopathtream.TripleWrapper.json

      - name: Smoke test Flatpak
        run: |
          flatpak run --command=triplewrapper-gui io.github.dinopathtream.TripleWrapper --help

      - name: Bundle Flatpak
        run: |
          flatpak build-bundle ~/.local/share/flatpak/repo \
            triplewrapper.flatpak io.github.dinopathtream.TripleWrapper

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v5
        with:
          name: triplewrapper-flatpak
          path: triplewrapper.flatpak

  # Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [integration, flatpak]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build core binary
        run: |
          cd src/core
          cargo build --release

      - name: Download Flatpak bundle
        uses: actions/download-artifact@v5
        with:
          name: triplewrapper-flatpak

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src/core/target/release/triplewrapper-core
            triplewrapper.flatpak
