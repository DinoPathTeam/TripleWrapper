name: Feature request
description: Propose an idea (offline-first scope)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Mockups welcome.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope check
      description: Does it work fully offline and sandboxed? If not, why is an exception justified?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
