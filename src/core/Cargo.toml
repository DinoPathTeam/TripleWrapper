[package]
name = "triplewrapper-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core engine for TripleWrapper - archive management with smart storage decisions"
repository = "https://github.com/triplewrapper/triplewrapper"
categories = ["command-line-utilities", "compression", "filesystem"]
keywords = ["archive", "7z", "compression", "storage", "cache"]

[lib]
name = "triplewrapper_core"
crate-type = ["cdylib", "rlib"]  # cdylib for Python CFFI, rlib for Rust tests

[dependencies]
# Async runtime
tokio = { version = "1.38", features = ["full", "rt-multi-thread"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Filesystem & paths
walkdir = "2.4"
async-walkdir = "1.0"

# UUID for queue items
uuid = { version = "1.0", features = ["v4", "serde"] }

# Process management
tokio-process = "0.2"
async-trait = "0.1"

# Hashing
blake3 = "1.5"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
hex = "0.4"

# Secret handling (passwords wiped on drop, never logged)
zeroize = "1"

# System info
sysinfo = "0.30"
libc = "0.2"

# Time & CPU
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.16"

# Logging
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
anyhow = "1.0"
thiserror = "1.0"

# Configuration
config = { version = "0.14", features = ["toml"] }
toml = "0.8"
dirs-next = "2.0"

# IPC (for GUI communication)
zbus = { version = "4.0", features = ["tokio"] }
zvariant = "4.2"
zvariant_derive = "4.2"

# CLI (for standalone testing)
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
pretty_assertions = "1.4"

[build-dependencies]
vergen = "7.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = true