<?xml version="1.0" encoding="UTF-8"?>
<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#2384e4"/>
  
  <!-- Three layered rectangles representing archive layers -->
  <g transform="translate(68, 68)">
    <!-- Bottom layer (original) -->
    <rect x="0" y="16" width="120" height="80" rx="8" fill="#1a5fb4" opacity="0.8"/>
    <text x="60" y="68" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">ORIGINAL</text>
    
    <!-- Middle layer (cache/workspace) -->
    <rect x="16" y="0" width="120" height="80" rx="8" fill="#e67e22" opacity="0.9"/>
    <text x="76" y="52" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">CACHE</text>
    
    <!-- Top layer (final) -->
    <rect x="32" y="-16" width="120" height="80" rx="8" fill="#27ae60"/>
    <text x="92" y="36" text-anchor="middle" dominant-baseline="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="white">FINAL</text>
  </g>
  
  <!-- Three dots indicating layers -->
  <g transform="translate(200, 50)">
    <circle cx="0" cy="0" r="6" fill="#1a5fb4" opacity="0.8"/>
    <circle cx="0" cy="30" r="6" fill="#e67e22" opacity="0.9"/>
    <circle cx="0" cy="60" r="6" fill="#27ae60"/>
  </g>
</svg>