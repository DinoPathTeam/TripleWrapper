# Local hygiene only: linters already run in CI (ruff, mypy, clippy,
# fmt, meson guard). Install once: pacman -S pre-commit && pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2048']
      - id: mixed-line-ending
        args: ['--fix=lf']
